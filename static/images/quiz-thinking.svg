<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Thinking child -->
  <circle cx="100" cy="80" r="45" fill="#FFD93D"/>
  <!-- Hair -->
  <ellipse cx="100" cy="55" rx="40" ry="20" fill="#FF9800"/>
  <!-- Eyes -->
  <circle cx="85" cy="75" r="6" fill="#333"/>
  <circle cx="115" cy="75" r="6" fill="#333"/>
  <circle cx="87" cy="73" r="2" fill="white"/>
  <circle cx="117" cy="73" r="2" fill="white"/>
  <!-- Thinking expression -->
  <ellipse cx="100" cy="90" rx="8" ry="5" fill="#333"/>
  <!-- Hand on chin -->
  <circle cx="130" cy="100" r="12" fill="#FFD93D"/>
  <line x1="125" y1="110" x2="115" y2="130" stroke="#FFD93D" stroke-width="8" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="75" y="125" width="50" height="50" rx="15" fill="#2196F3"/>
  <!-- Question marks floating -->
  <text x="140" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="#FF4081">?</text>
  <text x="50" y="45" font-family="Arial" font-size="18" font-weight="bold" fill="#4CAF50">?</text>
  <text x="155" y="75" font-family="Arial" font-size="16" font-weight="bold" fill="#FFD93D">?</text>
  <!-- Thought bubble -->
  <ellipse cx="155" cy="35" rx="25" ry="18" fill="white" opacity="0.9"/>
  <circle cx="135" cy="55" r="5" fill="white" opacity="0.8"/>
  <circle cx="125" cy="65" r="3" fill="white" opacity="0.7"/>
  <!-- Lightbulb in thought -->
  <ellipse cx="155" cy="32" rx="8" ry="10" fill="#FFD93D"/>
  <rect x="151" y="42" width="8" height="5" rx="2" fill="#FF9800"/>
  <line x1="155" y1="20" x2="155" y2="15" stroke="#FFD93D" stroke-width="2" stroke-linecap="round"/>
  <line x1="147" y1="25" x2="143" y2="21" stroke="#FFD93D" stroke-width="2" stroke-linecap="round"/>
  <line x1="163" y1="25" x2="167" y2="21" stroke="#FFD93D" stroke-width="2" stroke-linecap="round"/>
</svg>