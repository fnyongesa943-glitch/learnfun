  <circle cx="100" cy="40" r="4" fill="#4CAF50"/>
  <!-- Eyes -->
  <circle cx="88" cy="65" r="5" fill="#333"/>
  <circle cx="112" cy="65" r="5" fill="#333"/>
  <circle cx="90" cy="63" r="2" fill="white"/>
  <circle cx="114" cy="63" r="2" fill="white"/>
  <!-- Smile -->
  <path d="M90 80 Q100 90 110 80" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
