  <!-- Map in hand -->
  <rect x="65" y="125" width="20" height="25" rx="2" fill="#FFD93D" transform="rotate(-10 75 137)"/>
  <line x1="70" y1="130" x2="80" y2="128" stroke="#FF9800" stroke-width="1" transform="rotate(-10 75 137)"/>
  <line x1="68" y1="135" x2="78" y2="133" stroke="#FF9800" stroke-width="1" transform="rotate(-10 75 137)"/>
  <line x1="72" y1="140" x2="82" y2="138" stroke="#FF9800" stroke-width="1" transform="rotate(-10 75 137)"/>
  <!-- Trees in background -->
  <rect x="25" y="150" width="8" height="25" fill="#8B4513"/>
  <circle cx="29" cy="140" r="18" fill="#4CAF50"/>
  <circle cx="22" cy="145" r="12" fill="#4CAF50" opacity="0.8"/>
  <circle cx="36" cy="148" r="10" fill="#4CAF50" opacity="0.7"/>
  <!-- Path -->
  <path d="M30 180 Q60 170 90 175 Q120 180 150 170 Q170 165 180 170" fill="none" stroke="#FF9800" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,4"/>
  <!-- Stars/sparkles -->
  <polygon points="160,30 163,38 171,38 165,43 167,51 160,46 153,51 155,43 149,38 157,38" fill="#FFD93D" opacity="0.8"/>
  <polygon points="40,20 42,26 48,26 43,30 45,36 40,32 35,36 37,30 32,26 38,26" fill="#FF4081" opacity="0.7"/>
  <circle cx="175" cy="50" r="4" fill="#2196F3" opacity="0.6"/>
