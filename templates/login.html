{% extends "base.html" %}

{% block title %}Login - LearnFun{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-icon">&#128273;</div>
        <h2>Welcome Back!</h2>
        <p>Log in to continue your learning adventure!</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">&#128065;&#65039;</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                &#128640; Log In
            </button>
        </form>

        <p style="margin-top: var(--space-lg); font-size: 0.9375rem;">
            Don't have an account?
            <a href="{{ url_for('auth.signup') }}" style="font-weight: 700;">Sign up here!</a>
        </p>
    </div>
</div>

{% block extra_js %}
<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '&#128064;';
    } else {
        input.type = 'password';
        btn.textContent = '&#128065;&#65039;';
    }
}
</script>
{% endblock %}
{% endblock %}
