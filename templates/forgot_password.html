{% extends "base.html" %}

{% block title %}Forgot Password - LEARNFUN CHILDREN LEARNING WEB{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-icon">&#128231;</div>
        <h2>Forgot Password?</h2>
        <p>Enter your email and we'll send you a 6-digit code to reset your password.</p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required value="{{ email }}">
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                &#128231; Send Reset Code
            </button>
        </form>

        <p style="margin-top: var(--space-lg); font-size: 0.9375rem;">
            Remember your password?
            <a href="{{ url_for('auth.login') }}" style="font-weight: 700;">Log in here!</a>
        </p>
    </div>
</div>
{% endblock %}
