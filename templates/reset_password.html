{% extends "base.html" %}

{% block title %}Reset Password - LEARNFUN CHILDREN LEARNING WEB{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-icon">&#128274;</div>
        <h2>Set New Password</h2>
        <p>Choose a new password for your account.</p>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" class="form-control" placeholder="At least 4 characters" required minlength="4">
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">&#128065;&#65039;</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your password" required minlength="4">
                    <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)">&#128065;&#65039;</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                &#128284; Reset Password
            </button>
        </form>

        <p style="margin-top: var(--space-lg); font-size: 0.9375rem;">
            <a href="{{ url_for('auth.login') }}" style="font-weight: 700;">Back to Login</a>
        </p>
    </div>
</div>

{% block extra_js %}
<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '&#128064;';
    } else {
        input.type = 'password';
        btn.textContent = '&#128065;&#65039;';
    }
}
</script>
{% endblock %}
{% endblock %}
